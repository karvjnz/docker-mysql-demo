services:

  mysql:

    image: mysql:8.4

    container_name: mysql

    environment:
      MYSQL_ROOT_PASSWORD: root123

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

  app:

    build: .

    container_name: employee-app

    ports:
      - "3000:3000"

    depends_on:
      - mysql

volumes:
  mysql_data:
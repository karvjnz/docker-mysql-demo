services:

  mysql:

    image: mysql:8.4

    container_name: mysql

    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: companydb

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-proot123"
        ]

      interval: 5s
      timeout: 5s
      retries: 10

      start_period: 30s


  app:

    build: .

    container_name: employee-app

    ports:
      - "3000:3000"

    depends_on:

      mysql:
        condition: service_healthy


volumes:

  mysql_data:
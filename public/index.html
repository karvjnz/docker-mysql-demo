<!DOCTYPE html>
<html>

<head>
    <title>Customer Query Form</title>
</head>

<body>

<h2>Customer Query Form</h2>

<form id="queryForm">

    <p>
        <input
            type="text"
            id="full_name"
            placeholder="Full Name"
            required>
    </p>

    <p>
        <input
            type="email"
            id="email"
            placeholder="Email"
            required>
    </p>

    <p>
        <input
            type="text"
            id="phone"
            placeholder="Phone Number">
    </p>

    <p>
        <input
            type="text"
            id="country"
            placeholder="Country">
    </p>

    <p>
        <textarea
            id="message"
            rows="6"
            cols="50"
            maxlength="1000"
            placeholder="Enter your query">
        </textarea>
    </p>

    <button type="submit">
        Submit Query
    </button>

</form>

<p id="status"></p>

<script>

document
.getElementById("queryForm")
.addEventListener(
    "submit",
    async function(e)
{

    e.preventDefault();

    const payload = {

        full_name:
            document.getElementById("full_name").value,

        email:
            document.getElementById("email").value,

        phone:
            document.getElementById("phone").value,

        country:
            document.getElementById("country").value,

        message:
            document.getElementById("message").value
    };

    const response =
        await fetch("/queries", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify(payload)
        });

    const result =
        await response.json();

    if(result.success)
    {
        document.getElementById("status").innerHTML =
            "✅ Query submitted successfully";

        document.getElementById("queryForm").reset();
    }
    else
    {
        document.getElementById("status").innerHTML =
            "❌ Failed to submit query";
    }
});

</script>

</body>
</html>
